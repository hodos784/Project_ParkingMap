<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울 주차장 지도</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>
</head>
<body>

<div id="map"></div>

<div class="hud">
  <p class="eyebrow">Seoul Parking Census</p>
  <h1 id="hudTitle">서울 전체</h1>
  <div class="hud-num" id="hudSpaces">–</div>
  <div class="hud-lbl" id="hudSpacesLbl">총 주차가능면수</div>
  <button class="back-btn" id="backBtn" hidden>← 서울 전체보기</button>
  <p class="hint" id="hint">행정구를 클릭하면 면수가 표시됩니다 · 더블클릭하면 동별로 확대됩니다</p>
</div>

<div class="legend" id="legend">
  <p class="legend-title" id="legendTitle">자치구별 주차면수</p>
  <div class="ramp" id="ramp"></div>
  <div class="ramp-labels"><span id="rampMin">0</span><span id="rampMax">–</span></div>
  <div class="legend-row"><span class="legend-dot dot-public"></span>공영주차장</div>
  <div class="legend-row"><span class="legend-dot dot-private"></span>민영주차장</div>
</div>

<script src="script.js"></script>
</body>
</html>
